name: Code Quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  frontend-quality:
    name: Frontend Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: ./web-app/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: ./web-app

      - name: Build frontend
        run: npm run build
        working-directory: ./web-app

      - name: Lint frontend
        run: npm run lint
        working-directory: ./web-app

      - name: Test frontend build contract
        run: npm test
        working-directory: ./web-app

      - name: Audit production frontend dependencies
        # audit:ci permits only reviewed, unexpired advisories from
        # audit-allowlist.json and always rejects unexpected highs or criticals.
        run: npm run audit:ci
        working-directory: ./web-app

      - name: Upload frontend build artifact
        uses: actions/upload-artifact@v7
        with:
          name: web-app-dist
          path: ./web-app/dist
          if-no-files-found: error

  backend-quality:
    name: Backend Quality
    runs-on: ubuntu-latest
    needs: frontend-quality
    steps:
      - uses: actions/checkout@v6

      - name: Download frontend build artifact
        uses: actions/download-artifact@v8
        with:
          name: web-app-dist
          path: ./web-app/dist

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Install backend quality tools
        run: |
          go install github.com/fzipp/gocyclo/cmd/gocyclo@v0.6.0
          go install github.com/golangci/golangci-lint/cmd/golangci-lint@v1.64.8
          go install github.com/securego/gosec/v2/cmd/gosec@v2.22.4

      - name: Install mupdf
        run: sudo apt-get update && sudo apt-get install -y mupdf

      - name: Set library path
        run: echo "/usr/lib" | sudo tee -a /etc/ld.so.conf.d/mupdf.conf && sudo ldconfig

      - name: Check Go formatting
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "Go files need formatting:"
            gofmt -d .
            exit 1
          fi

      - name: Run Go vet
        run: go vet ./...

      - name: Run Go lint
        run: $(go env GOPATH)/bin/golangci-lint run --timeout=5m ./...

      - name: Run Go security scan
        run: $(go env GOPATH)/bin/gosec ./...

      - name: Check Go code complexity regressions
        run: ./scripts/ci/check-go-complexity.sh

      - name: Run Go coverage
        run: |
          go test -race -coverprofile=coverage.txt -covermode=atomic ./...
          go tool cover -func=coverage.txt
