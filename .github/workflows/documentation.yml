name: Documentation

on:
  push:
    branches: [main]
    paths:
      - "README.md"
      - "CHANGELOG.md"
      - "docs/**"
      - "web-app/README.md"
      - "docker-compose.ghcr.yml"
      - ".github/workflows/documentation.yml"
  pull_request:
    branches: [main]
    paths:
      - "README.md"
      - "CHANGELOG.md"
      - "docs/**"
      - "web-app/README.md"
      - "docker-compose.ghcr.yml"
      - ".github/workflows/documentation.yml"

permissions:
  contents: read

jobs:
  maintained-doc-links:
    name: Maintained Doc Links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Check maintained documentation links
        run: |
          docker run --rm \
            -v "$PWD:/workspace" \
            -w /workspace \
            lycheeverse/lychee:latest \
            --no-progress \
            --max-concurrency 4 \
            README.md \
            CHANGELOG.md \
            web-app/README.md \
            docs/*.md

  typescript-documentation:
    name: TypeScript Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: web-app/package-lock.json

      - name: Install frontend dependencies
        working-directory: ./web-app
        run: npm ci

      - name: Generate TypeScript documentation
        working-directory: ./web-app
        run: |
          OUTDIR="$(mktemp -d)"
          npx --yes typedoc@0.28.18 --entryPointStrategy expand --out "$OUTDIR" src
